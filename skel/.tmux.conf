# ============================================================
#   tmux.conf
# ============================================================

# ------------------------------------------------------------
#  0. 색상 / 변수 정의
# ------------------------------------------------------------
#  기존 설정 파일 상단에 있던 color_* / separator_* / wg_user_host
#  정의 블록을 이 자리에 그대로 옮겨 붙이세요.
#  아래 nested mode 와 status-right 가 이 값들을 참조합니다.
#
#  필요한 변수:
#    color_dark, color_light, color_status_text,
#    color_window_off_status_bg, color_window_off_status_current_bg,
#    color_window_off_indicator, separator_powerline_right, wg_user_host


# ------------------------------------------------------------
#  1. 기본 동작
# ------------------------------------------------------------
# 학습 로그를 넉넉히 보관 (기본 2000줄은 스텝 몇 번이면 사라짐)
set -g history-limit 100000

# ESC 반응 지연 제거 (기본 500ms — vim/nvim 에서 체감됨)
set -sg escape-time 10

# vim autoread / LSP 포커스 감지
set -g focus-events on

# 인덱스를 1부터
set -g base-index 1
setw -g pane-base-index 1

# 윈도우 삭제 시 번호 자동 정렬
set -g renumber-windows on

# 여러 클라이언트가 붙었을 때 크기 꼬임 방지
setw -g aggressive-resize on

# display 메시지 표시 시간
set -g display-time 2000

# 세션 하나가 죽어도 detach 되지 않음
set -g detach-on-destroy off

# 마우스로 페인/윈도우 전환
set-option -g mouse on


# ------------------------------------------------------------
#  2. 터미널 / 색상 / 클립보드
# ------------------------------------------------------------
# truecolor — 에디터 테마 색이 뭉개지는 것 방지
# (컨테이너에 tmux-256color terminfo 가 없으면 ncurses-term 설치 필요)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# 이미지 프로토콜 등 OSC 시퀀스 통과 허용
set -g allow-passthrough on

# OSC 52 — 원격 서버에서 yank 한 내용이 로컬 클립보드로 전달됨
set -g set-clipboard on


# ------------------------------------------------------------
#  3. 설정 리로드
# ------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"


# ------------------------------------------------------------
#  4. 레이아웃 / 윈도우
# ------------------------------------------------------------
# layout equally
bind e select-layout tiled

# quickly open a new window
bind N new-window

# reorder window number
bind m movew -r \; display "window number reordered!"

# synchronize all panes in a window (상태 표시 포함)
bind y setw synchronize-panes \; display "sync #{?pane_synchronized,ON,OFF}"

# zoom
bind-key -T root F11 resize-pane -Z


# ------------------------------------------------------------
#  5. 페인 이동 / 리사이즈
# ------------------------------------------------------------
# pane movement shortcuts (same as vim) — -r 로 연속 이동 가능
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# move pane without prefix
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# resize pane
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5


# ------------------------------------------------------------
#  6. 페인 분리 / 합치기
# ------------------------------------------------------------
unbind f

# 현재 페인을 백그라운드 윈도우로 떼어내기
bind b break-pane -d \; select-layout even-vertical

# 다른 페인을 현재 윈도우로 가져오기
bind f command-prompt -p "enter what pane to bring:" "join-pane -vs '%%' ; select-layout even-vertical"


# ------------------------------------------------------------
#  7. 세션 관리
# ------------------------------------------------------------
bind C-s choose-tree -Zs
bind -r ( switch-client -p
bind -r ) switch-client -n


# ------------------------------------------------------------
#  8. Nested mode (F12 토글)
# ------------------------------------------------------------
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
  set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
  set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S


# ------------------------------------------------------------
#  9. 상태바
# ------------------------------------------------------------
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-right "$wg_is_keys_off #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_loadavg} | $wg_user_host"


# ------------------------------------------------------------
#  10. Copy mode (vi)
# ------------------------------------------------------------
setw -g mode-keys vi

# copy mode using 'Esc'
unbind [
bind Escape copy-mode

# paste using 'p' — bracketed paste 로 붙여 자동 들여쓰기 계단 방지
unbind p
bind p paste-buffer -p

# vi 키 바인딩
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# 마우스 드래그 종료 시 선택이 즉시 사라지는 것 방지
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear